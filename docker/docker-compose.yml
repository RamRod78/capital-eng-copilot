version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: capital_eng_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-capital_eng}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-capital_eng}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - capital_eng_net

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: capital_eng_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-capital_eng}
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    ports:
      - "${APP_PORT:-8501}:8501"
    networks:
      - capital_eng_net

volumes:
  pgdata:
    driver: local

networks:
  capital_eng_net:
    driver: bridge
